name: library_manager
description: "QR Code Based Library Manager - Modern Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  mobile_scanner: ^5.2.3
  cached_network_image: ^3.3.1
  image_picker: ^0.8.7+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
